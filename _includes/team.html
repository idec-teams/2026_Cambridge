<section id="comm" class="team-grid" aria-label="Team members">
  {% for member in site.team %}
    {% assign member_image = member.pic | default: "Default_pfp.jpg" %}
    <article class="team-member">
      <img
        src="{{ '/img/comm/' | append: member_image | relative_url }}"
        alt="{{ member.name | default: 'Team member' }}"
        width="250"
        height="250"
        loading="lazy"
      >
      <h4>{{ member.name }}</h4>
      <p>{{ member.course }}</p>
      {% if member.email or member.linkedin %}
        <div class="team-member__actions">
          {% if member.email %}
            <a
              class="team-member__button"
              href="mailto:{{ member.email }}"
              aria-label="Email {{ member.name }}"
            ><i class="fas fa-envelope" aria-hidden="true"></i> Email</a>
          {% endif %}
          {% if member.linkedin %}
            <a
              class="team-member__button"
              href="{{ member.linkedin }}"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="{{ member.name }} on LinkedIn"
            ><i class="fab fa-linkedin" aria-hidden="true"></i> LinkedIn</a>
          {% endif %}
        </div>
      {% endif %}
    </article>
  {% endfor %}
</section>
