<section id="advisors" class="team-grid" aria-label="Advisors">
  {% for member in site.advisors %}
    {% assign member_image = member.pic | default: "Default_pfp.jpg" %}
    {% assign member_email = member.email | default: site.email %}
    <article class="team-member">
      <img
        src="{{ '/img/comm/' | append: member_image | relative_url }}"
        alt="{{ member.name | default: 'Team member' }}"
        width="250"
        height="250"
        loading="lazy"
      >
      <h4>{{ member.name }}</h4>
      {% if member.role %}
        <p>{{ member.role }}</p>
      {% endif %}
      {% if member.email %}
        <a
          class="team-member__email"
          href="mailto:{{ member_email }}"
          aria-label="Email {{ member.name }}"
        >Email</a>
      {% endif %}
    </article>
  {% endfor %}
</section>
