# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: iDEC Cambridge 2026
email: cambridgeidec2026@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  iDEC Cambridge 2026 wiki and project notes.
baseurl: "/2026_Cambridge" # the subpath of your site, e.g. /blog
url: "https://idec-teams.github.io" # the base hostname & protocol for your site, e.g. http://example.com
lang: en
timezone: Europe/London

text_skin: default
highlight_theme: default

