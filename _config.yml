# Build settings
theme: jekyll-text-theme
markdown: kramdown
highlighter: rouge
permalink: date
paginate: 8
paginate_path: /page:num

search:
  provider: false
sharing:
  provider: false
comments:
  provider: false
analytics:
  provider: false

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      aside:
        toc: true

